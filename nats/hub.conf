          "$JS.API.CONSUMER.DELETE.OBJ_MAIL_FILES.>"
        ] }
        subscribe: { allow: ["mail.studio-codex.*", "agents.*.presence", "_INBOX_studio-codex.>"] }
      }
    }

    # ---------------- Телеграм-мост ----------------------------------------
    # Единственная учётка, которая видит переписку целиком: она подписана на
    # mail.> и создаёт consumer'ы с любым фильтром. Та же асимметрия, что
    # раньше защищала bus.log — писать могут все, видеть всё только витрина.
    # Поэтому мост живёт на самом VPS и ходит на 127.0.0.1, его seed не
    # уезжает на клиентские машины вообще.
    { nkey: UAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABRIDGE, permissions: {
        publish: { allow: [
          "mail.*.human",
          "mail.*.bridge",
          "agents.human.presence",
          "$JS.API.INFO",
          # Топологию создаёт мост: у агентов права STREAM.CREATE нет и быть
          # не должно — с ним можно сменить retention на work-queue, и письма
          # начнут исчезать при чтении.
          "$JS.API.STREAM.CREATE.MAIL", "$JS.API.STREAM.UPDATE.MAIL",
          "$JS.API.STREAM.INFO.MAIL",
          "$JS.API.CONSUMER.CREATE.MAIL.>",
          "$JS.API.CONSUMER.INFO.MAIL.>",
          "$JS.API.CONSUMER.MSG.NEXT.MAIL.>",
          "$JS.API.CONSUMER.DELETE.MAIL.>",
          "$JS.ACK.MAIL.>",
          "$JS.API.STREAM.CREATE.KV_mail_state", "$JS.API.STREAM.INFO.KV_mail_state",
          # Свой бакет витрины: соответствие «тред — тема супергруппы».
          "$KV.bridge_topics.>",
          "$JS.API.STREAM.CREATE.KV_bridge_topics",
          "$JS.API.STREAM.INFO.KV_bridge_topics",
          "$JS.API.DIRECT.GET.KV_bridge_topics.>",
          "$JS.API.CONSUMER.CREATE.KV_bridge_topics.>",
          "$JS.API.CONSUMER.MSG.NEXT.KV_bridge_topics.>",
          "$JS.API.CONSUMER.DELETE.KV_bridge_topics.>",
          # Отметки «письмо показано» — отдельный бакет с TTL, а не ключи
          # рядом с темами. Они копятся на каждое письмо и живут вечно, а
          # обратный поиск темы перебирает бакет целиком: вперемешку эти
          # два срока жизни давали растущую плату за каждое сообщение
          # человека. Consumer'ы здесь не нужны — маркеры пишутся и читаются
          # поштучно, без Keys и Watch.
          "$KV.bridge_posted.>",
          "$JS.API.STREAM.CREATE.KV_bridge_posted",
          "$JS.API.STREAM.INFO.KV_bridge_posted",
          "$JS.API.DIRECT.GET.KV_bridge_posted.>",
          # Позиция чтения обновлений Telegram. В памяти она сбрасывалась при
          # каждом рестарте, и мост заново разбирал уже доставленные
          # сообщения человека. Ключ один, перебор не нужен.
          "$KV.bridge_state.>",
          "$JS.API.STREAM.CREATE.KV_bridge_state",
          "$JS.API.STREAM.INFO.KV_bridge_state",
          "$JS.API.DIRECT.GET.KV_bridge_state.>",
          # Маршруты ответов: «пост в чате -> разговор, проект, участники».
          # Отдельный бакет от тем, потому что TTL в JetStream задаётся на
          # бакет целиком: маршруты живут 90 дней вместе с письмами, а темы
          # проектов — бессрочно. Consumer'ы не нужны, доступ по ключу прямой.
          #
          # Без этих прав новый мост НЕ ПОДНИМЕТСЯ ВОВСЕ: он открывает бакет
          # при старте, а отказ по правам приходит не ответом, а молчанием до
          # таймаута — со стороны выглядит как «хаб не отвечает».
          "$KV.bridge_routes.>",
          "$JS.API.STREAM.CREATE.KV_bridge_routes",
          "$JS.API.STREAM.INFO.KV_bridge_routes",
          "$JS.API.DIRECT.GET.KV_bridge_routes.>",
          "$JS.API.STREAM.CREATE.KV_claims",
          "$JS.API.STREAM.INFO.KV_claims",
          "$KV.claims.>",
          "$JS.API.DIRECT.GET.KV_claims.>",
          "$JS.API.CONSUMER.CREATE.KV_claims.>",
          "$JS.API.CONSUMER.MSG.NEXT.KV_claims.>",
          "$JS.API.CONSUMER.DELETE.KV_claims.>",
          "$O.MAIL_FILES.>",
          "$JS.API.STREAM.CREATE.OBJ_MAIL_FILES",
          "$JS.API.STREAM.UPDATE.OBJ_MAIL_FILES",
          "$JS.API.STREAM.INFO.OBJ_MAIL_FILES",
          "$JS.API.DIRECT.GET.OBJ_MAIL_FILES.>"
        ] }
        subscribe: { allow: ["mail.>", "agents.*.presence", "_INBOX_bridge.>"] }
      }
    }
  ]
}

# ============================================================================
# Лимиты
# ============================================================================
max_payload: 4MB       # письмо ограничено 64 КБ в коде, запас на служебное
max_connections: 128
write_deadline: "10s"

# Пинги чаще дефолта: быстрее замечаем уснувший ноутбук и чистим соединение.
ping_interval: "30s"
ping_max: 3

debug: false
trace: false
logtime: true
log_file: "/var/log/nats/nats-server.log"
