# ============================================================================
# NATS hub — публичный VPS. Единственный узел с белым IP и DNS-именем.
# Запуск: nats-server -c /etc/nats/hub.conf
#
# Модель доступа:
#   - все узлы (Pi, три мака) подключаются СЮДА исходящим TLS-соединением;
#   - входящих дырок в файрволах на стороне машин не требуется вообще;
#   - на VPS открыт ровно один порт: 4222/tcp (TLS). Больше ничего.
#
# Аутентификация: у каждого агента своя NKey-пара (Ed25519). В этом файле
# лежат только ПУБЛИЧНЫЕ ключи (начинаются на U...) — их не жалко хранить
# в git. Приватный seed (S...) никогда не покидает свою машину и на VPS
# отсутствует: компрометация хаба не даёт возможности выдать себя за агента.
# ============================================================================

server_name: mesh-hub

# Слушаем на всех интерфейсах: узлы приходят из интернета.
# Защита — TLS + NKey, анонимного доступа нет ни на каком порту.
host: 0.0.0.0
port: 4222

# --- TLS --------------------------------------------------------------------
# Обязателен для всех клиентов. Сертификат — обычный серверный от Let's Encrypt
# на DNS-имя VPS (mesh.example.com), выписывается certbot'ом.
# Клиентские сертификаты НЕ используются: удостоверение личности даёт NKey,
# TLS отвечает только за шифрование и аутентификацию сервера. Один механизм
# на одну задачу — не нужно поднимать собственный CA и ротировать 9 сертификатов.
#
# Пути ведут в /etc/nats/tls, а НЕ в /etc/letsencrypt, и это не мелочь.
# nats-server работает не от root и приватный ключ в live/ прочитать не может:
# certbot кладёт его 0600 root:root. Разовый chown на дерево letsencrypt
# ломается при первом же продлении — файлы создаются заново, права к ним не
# относятся, — а проявляется это лишь при следующем рестарте хаба, недели
# спустя. Копию с нужным владельцем кладёт deploy-хук certbot
# (deploy/certbot/nats-hub.sh), он же перезагружает сервер.
tls {
  cert_file: "/etc/nats/tls/fullchain.pem"
  key_file:  "/etc/nats/tls/privkey.pem"
  timeout: 5
  # verify: true не ставим — это включило бы обязательные клиентские сертификаты.
}

# --- Мониторинг -------------------------------------------------------------
# Только на localhost: наружу /varz отдавать нечего.
# Смотреть через SSH-туннель: ssh -L 8222:127.0.0.1:8222 vps
http: 127.0.0.1:8222

# --- JetStream --------------------------------------------------------------
# Письма лежат в потоке MAIL, позиция чтения каждого агента — в KV mail_state.
# Хранилище на диске: письма должны переживать рестарт хаба и сон получателя.
jetstream {
  store_dir: "/var/lib/nats/jetstream"
  max_memory_store: 256MB
  max_file_store: 8GB
}

# ============================================================================
# Учётные записи
# ============================================================================
# Шаблон прав агента <ID>:
#   publish:   mail.*                     — написать письмо любому агенту
#              agents.<ID>.presence       — только СВОЯ визитка
#              $JS.API.*                  — ровно те вызовы, что делает код
#   subscribe: mail.<ID>                  — сигнал о письме в СВОЙ ящик
#              agents.*.presence          — визитки соседей (роутинг по проектам)
#              _INBOX_<ID>.>              — ответы сервера ЛИЧНО этому агенту
#
# ГЛАВНОЕ ПРАВИЛО ФАЙЛА: в правах агента на CONSUMER.* нет ни одного шаблона.
#
#   $JS.API.CONSUMER.CREATE.MAIL.inbox-<ID>.mail.<ID>
#   $JS.API.CONSUMER.MSG.NEXT.MAIL.inbox-<ID>
#   $JS.API.CONSUMER.DELETE.MAIL.inbox-<ID>
#
# Изоляция держится на ТОЧНОМ имени consumer'а, и вот почему одного фильтра
# мало. Тема создания включает фильтр, поэтому чужой ящик создать нельзя —
# это правда. Но тема ВЫБОРКИ фильтра не содержит: она выглядит как
# CONSUMER.MSG.NEXT.<поток>.<consumer>. Дай агенту MSG.NEXT.MAIL.> — и он
# сырым запросом вытянет письма из любого consumer'а, чьё имя знает. Имя
# consumer'а моста (telegram-bridge) лежит в исходниках, гадать не нужно.
# То же с DELETE: с шаблоном агент сносит consumer моста, и витрина
# переигрывает всю переписку заново.
#
# Всё проверено живым сервером в internal/bus/perms_test.go, включая
# мутационную проверку: возврат любого из шаблонов красит тесты
# «НеКрадётИзКонсьюмераМоста» и «НеУдаляетЧужойКонсьюмер».
#
# Отсюда требование к коду: Inbox обязан ходить консьюмером с именем
# bus.InboxConsumer(agentID). Ordered consumer сюда не годится — у него имя
# случайное, под него пришлось бы вернуть шаблон и обе дыры вместе с ним.
#
# ТРЕТЬЕ ГЛАВНОЕ ПРАВИЛО: отправитель — часть темы, и его проверяет хаб.
#
#   тема:    mail.<получатель>.<отправитель>
#   publish: mail.*.<ID>       — соврать про себя нельзя
#
# `*` совпадает ровно с одним токеном, поэтому подставить чужой идентификатор
# вторым нельзя: попытка опубликовать mail.m1-codex.human с ключом pi-claude
# даёт permissions violation. Раньше отправитель лежал только в теле письма,
# где его никто не удостоверял, и любой узел мог представиться `human` —
# самым авторитетным отправителем в сети.
#
# Право писать от имени человека есть ТОЛЬКО у моста: mail.*.human.
#
# Читатель обязан брать отправителя из темы (bus.SenderFromSubject), а не из
# поля from — тело удостоверено не больше, чем раньше.
# Стерегут TestОтправителяНельзяПодделать и TestFromИзТелаНеПеребиваетТему.
#
# ВТОРОЕ ГЛАВНОЕ ПРАВИЛО: namespace ответов у каждого СВОЙ.
#
#   subscribe: _INBOX_<ID>.>      а НЕ _INBOX.>
#
# Права на консьюмер защищают запрос, но письмо сервер отдаёт в reply-subject
# этого запроса. Пока дерево ответов было общим (_INBOX.>), любой агент
# подписывался на него и читал чужую почту в обход всех прав на консьюмеры —
# проверено эксплойтом, перехватывалось тело письма целиком.
#
# Клиент обязан подключаться с тем же префиксом: bus.Connect ставит
# nats.CustomInboxPrefix(bus.InboxPrefix(agentID)). Разъедется одно с другим —
# узел просто перестанет получать ответы, это заметно сразу.
# Стережёт TestАгентНеПодслушиваетЧужиеОтветы.
#
# Бакет claims — реестр занятых зон. Права на него у всех и широкие:
# запись общая по смыслу, иначе реестр бессмыслен. Создаёт бакет мост
# вместе с остальной топологией — у агентов STREAM.CREATE нет и здесь.
# Это единственное место, где ключи не разделены по владельцам: захват
# чужой зоны технически возможен, реестр защищает от случайности, а не
# от злого умысла, и в README это сказано прямо.
#
# Чего здесь намеренно НЕТ и почему:
#   $JS.API.STREAM.MSG.GET.MAIL и $JS.API.DIRECT.GET.MAIL.>
#     — отдают любое сообщение потока по номеру, в обход фильтра по теме.
#   $JS.API.CONSUMER.LIST.MAIL и .NAMES
#     — позволяют перечислить чужие consumer'ы и узнать их имена.
#   $JS.API.STREAM.CREATE.MAIL у агентов
#     — с ним агент меняет конфигурацию потока: убирает дедупликацию или
#       переключает retention на work-queue, после чего письма исчезают при
#       первом же чтении. Топологию поднимает мост.
#
# Публичные ключи ниже — заглушки, заменяются реальными при развёртывании.
# ============================================================================

