# Проверки, которые до сих пор гонялись руками.
#
# Руками они гонялись честно, но «честно» здесь держится на том, что человек
# помнит про `-count=1` и не путает зелёный кеш с зелёными тестами. Это и есть
# работа для машины.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Пишущих прав не нужно: сборка и тесты ничего не публикуют. Секретов в
# workflow нет вовсе — все проверки локальные, наружу ходит только загрузка
# зависимостей.
permissions:
  contents: read

env:
  # Версии закреплены: расхождение версии линтера между машиной и CI даёт
  # замечания, которых нет локально, и наоборот. Обе совпадают с тем, что
  # стоит на Pi.
  GO_VERSION: "1.26.6"
  GOLANGCI_VERSION: "v2.12.2"

jobs:
  test:
    name: Тесты, линтер, сборка
    runs-on: ubuntu-latest
    # Тесты поднимают настоящий nats-server внутри пакетов и ждут живых
    # ответов; на медленном раннере полный прогон занимает минуты, но не
    # десятки. Предел — страховка от зависшего теста, а не рабочая оценка.
    timeout-minutes: 20

    steps:
      # Мажоры держим на тех, что работают на Node 24. Четвёртый checkout и
      # пятый setup-go собраны под Node 20: раннеры их ещё запускают, но
      # принудительно на 24 и с предупреждением в журнале — то есть версия
      # уже неподдерживаемая, просто отказ отложен.
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # Кеш модулей и сборки: без него каждый прогон заново тянет
          # nats-server со всеми его зависимостями.
          cache: true

      # Начиная с шестой версии setup-go выставляет GOTOOLCHAIN=local, и это
      # меняет смысл GO_VERSION. Раньше go молча скачивал тулчейн, требуемый
      # директивой `go` в go.mod, — то есть прогон мог идти вовсе не на той
      # версии, что указана выше. Теперь версия ровно одна, а расхождение с
      # go.mod роняет прогон внятной ошибкой вместо тихой подмены.
      #
      # Печатаем её в журнал: при разборе «почему на CI иначе, чем локально»
      # это первый вопрос, и ответ на него не должен требовать раскопок.
      - name: Версия Go
        run: go version

      - name: Тесты
        # -count=1 отключает кеш результатов. Проверено: повтор без него
        # печатает "ok (cached)", а правка файла, который тест ОТКРЫВАЕТ
        # (шаблон hub.conf), кеш всё-таки инвалидирует — то есть в этом
        # случае флаг ничего не спасает.
        #
        # Он остаётся по другой причине: кеш не знает про то, чего тест не
        # открывает, — версию nats-server, содержимое кешей раннера,
        # состояние машины. Прогон в CI должен быть настоящим, а не отчётом
        # о прошлом прогоне; цена — минуты, и она того стоит.
        run: go test -count=1 ./...

      - name: Линтер
        # Ставим сам инструмент, а не через golangci-lint-action, и на то две
        # причины, обе из первого прогона на GitHub.
        #
        # Первая: action шестой версии НЕ УМЕЕТ линтер второй версии и
        # отвергает 2.12.2 ещё на подготовке задачи, до чекаута — «invalid
        # version string, golangci-lint v2 is not supported». То есть связка
        # action ↔ версия инструмента ломается там, где ни YAML, ни локальный
        # прогон её не проверяют.
        #
        # Вторая: action тянется с codeload.github.com, и два прогона из
        # четырёх легли на 429 оттуда же. Модульный прокси Go — другой хост;
        # одной внешней зависимостью в цепочке меньше.
        #
        # Версия берётся из той же переменной, что и раньше, поэтому разъехаться
        # с машинами разработчиков ей по-прежнему негде.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
          golangci-lint --version
          golangci-lint run

      - name: Разбор шаблона hub.conf
        # Отдельным шагом, хотя это тоже go test: у него своя причина падать
        # — испорченный шаблон прав, — и в общем прогоне она теряется среди
        # прочих тестов.
        run: make hub-check

      - name: Сборка
        run: make build

      - name: Кросс-сборка под машины сети
        # Артефакты не сохраняем: проверяется, что код компилируется под обе
        # целевые платформы, а не выпуск релиза.
        run: make cross

      - name: Сборка под произвольную цель
        # Цель `target` требует обе переменные явно и без них отказывается
        # работать. Проверяем и то, что она собирает, и то, что собирает
        # именно под запрошенную платформу: `go build` на неверных значениях
        # молча даст артефакт под хозяйскую архитектуру, а обнаружится это
        # на VPS, куда его привезут.
        run: |
          make target GOOS=linux GOARCH=amd64
          file bin/mesh-linux-amd64
          file bin/mesh-linux-amd64 | grep -q "x86-64" || {
            echo "артефакт собран не под ту архитектуру"
            exit 1
          }

      - name: nats-server не уехал в продакшн-граф
        # Инвариант из CLAUDE.md: сервер разрешён только в тестах. Попади он
        # в зависимости cmd/mesh — бинарник потяжелеет на каждой машине сети,
        # включая Pi, и заметить это без проверки невозможно.
        run: |
          if go list -deps ./cmd/mesh | grep -q nats-server; then
            echo "nats-server попал в зависимости cmd/mesh — он разрешён только в тестах"
            go list -deps ./cmd/mesh | grep nats-server
            exit 1
          fi
          echo "продакшн-граф чист"
