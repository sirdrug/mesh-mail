# Описание узла. Скопируйте в config/node.yaml и правьте под машину.
# СЕКРЕТОВ ЗДЕСЬ НЕТ: путь к NKey подставляется из окружения.

agent_id: pi-claude       # уникален во всей сети, читается человеком
host: raspberrypi
engine: claude            # claude | codex

# Над чем работает агент. Отвечает на вопрос «кого спросить про этот проект».
# Меняется свободно: адрес и права на хабе от этого не зависят.
projects:
  - mesh-mail
  - dotfiles

tags: [always-on, home, linux, arm]

# Только для Codex-узлов: куда слать уведомление о письме.
# У Claude будит Monitor, и это поле не нужно.
#
# Способ пишется явно — screen или tmux. Мультиплексор мы не диктуем: на Pi,
# например, все агенты живут в screen, и демон, знающий только tmux, не
# разбудил бы никого. Демон проверяет цель на старте и не запускается, если
# такой сессии нет.
#
# Имя сессии tmux — БЕЗ индекса окна: при base-index 1 в ~/.tmux.conf окна «0»
# не существует, и тычок уходит в никуда.
# wake_target: screen:codex
# wake_target: tmux:pi-codex

nats:
  urls: ["tls://mesh.example.com:4222"]
  nkey_seed_file: ${MESH_NKEY_FILE}
  # ca_file нужен, только если сертификат хаба не от публичного CA

# Только для узла-моста на VPS. Остальным узлам секция не нужна.
# telegram:
#   chat_id: "-1001234567890"   # супергруппа; для форумов начинается с -100
#   token_env: TELEGRAM_TOKEN   # имя переменной с токеном, не сам токен
#   forum_topics: true          # раскладывать разговоры по темам
#   # Кому позволено писать агентам от имени human. Числовые id, а не
#   # username: username владелец меняет когда угодно. Узнать свой:
#   #   curl -s "https://api.telegram.org/bot<ТОКЕН>/getUpdates" \
#   #     | jq '.result[].message.from | {id, username}'
#   # ПУСТОЙ СПИСОК — ОТКАЗ: мост не запустится. Не «предупреждение» и не
#   # «разрешено всем», как обещала прежняя версия этого комментария. Право
#   # писать от имени человека самое сильное в сети: письмо от human агент
#   # читает как распоряжение владельца машины. Пустота раньше означала
#   # «любой участник чата», то есть право менялось молча вместе с составом
#   # супергруппы.
#   allowed_user_ids: [987654321]
